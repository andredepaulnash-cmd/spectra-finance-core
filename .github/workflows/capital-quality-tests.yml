name: Capital Quality Research Checks

on:
  pull_request:
    branches: [spectra-core-phase2]
    paths:
      - research/capital_quality/**
      - research/holdout/**
      - docs/research-holdout/**
      - .github/workflows/capital-quality-tests.yml
      - .github/workflows/research-holdout-capture.yml

permissions:
  contents: read

jobs:
  causal-and-source-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the tested numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Check causal boundaries and source budgets
        run: python -m unittest discover -s research/capital_quality/tests -v
      - name: Check public-only capture and sealed protocol mechanics
        run: python -m unittest discover -s research/holdout/tests -v
