name: Spectra Phase 1 CI

on:
  # Feature/experiment branches are validated once through their PR instead of
  # paying for both a branch-push run and a pull-request run on the same SHA.
  push:
    branches:
      - spectra-core-phase2
  pull_request:
    branches:
      - spectra-core-phase2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep only the newest validation for a given PR or branch. This prevents
  # stale runs from consuming hosted-runner minutes while newer code is waiting.
  group: spectra-phase1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capital-core:
    name: Capital Core / Execution Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install locked dependencies
        run: uv sync --dev --frozen

      - name: Run Spectra Phase 1 focused tests
        run: |
          uv run pytest -q \
            tests/test_spectra_core.py \
            tests/test_spectra_kraken_execution_flow.py \
            tests/test_spectra_executor_accounting_flow.py \
            tests/test_position_hold_snapshot_ledger.py \
            tests/test_recovery_exposure_governor.py \
            tests/test_kraken_market_fabric.py \
            tests/test_stack_lock_manifest.py \
            tests/test_hummingbot_api_contract.py
