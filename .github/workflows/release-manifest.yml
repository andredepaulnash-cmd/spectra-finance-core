name: Spectra release manifest

on:
  pull_request:
    paths:
      - "release/**"
      - "scripts/spectra_release.py"
      - "scripts/spectra_upstream_watch.py"
      - "tests/test_spectra_release_manifest.py"
      - "tests/test_spectra_upstream_watch.py"
      - ".github/workflows/release-manifest.yml"
      - ".github/workflows/upstream-release-watch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate component manifest
        run: python scripts/spectra_release.py validate
      - name: Verify promotion is correctly blocked while candidate
        run: |
          if python scripts/spectra_release.py validate --require-approved; then
            echo "Candidate manifest unexpectedly passed the approved-release gate" >&2
            exit 1
          fi
      - name: Test release manifest invariants
        run: python -m unittest discover -s tests -p 'test_spectra_release_manifest.py' -v
      - name: Test upstream discovery invariants
        run: python -m unittest discover -s tests -p 'test_spectra_upstream_watch.py' -v
