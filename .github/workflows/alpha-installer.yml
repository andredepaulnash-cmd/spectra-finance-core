name: Alpha installer and safety checks

on:
  push:
    branches:
      - alpha/one-command-paper-demo-20261108
    paths:
      - install-alpha.sh
      - ALPHA-TEST.md
      - condor/fetchers/spectra_runtime.py
      - condor/web/routes/servers.py
      - tests/test_spectra_runtime_fail_closed.py
      - scripts/configure_alpha_paper_connector.py
      - scripts/configure_alpha_paper_state.py
      - tests/test_configure_alpha_paper_connector.py
      - tests/test_configure_alpha_paper_state.py tests/test_hummingbot_mcp_config_dir.py
      - tests/test_hummingbot_mcp_config_dir.py
      - .github/workflows/alpha-installer.yml
  pull_request:
    paths:
      - install-alpha.sh
      - ALPHA-TEST.md
      - condor/fetchers/spectra_runtime.py
      - condor/web/routes/servers.py
      - tests/test_spectra_runtime_fail_closed.py
      - .github/workflows/alpha-installer.yml

jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n install-alpha.sh
      - name: Enforce paper-only and no host socket mount
        run: |
          grep -q 'SPECTRA_PAPER_ONLY=true' install-alpha.sh
          grep -q 'SPECTRA_ALLOW_LIVE_EXECUTION=false' install-alpha.sh
          grep -q 'docker-compose.alpha.yml' install-alpha.sh
          grep -q 'docker.sock' install-alpha.sh
          ! grep -Eq 'docker compose .*docker-compose.yml up|podman-compose .*docker-compose.yml up' install-alpha.sh
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Core dependencies
        run: uv sync --locked --dev --python 3.12
      - name: Test alpha runtime safety and Kraken paper configuration
        run: uv run --python 3.12 pytest -q tests/test_spectra_runtime_fail_closed.py tests/test_configure_alpha_paper_connector.py tests/test_configure_alpha_paper_state.py
