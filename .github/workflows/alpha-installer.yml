name: Alpha installer and safety checks

on:
  push:
    branches:
      - alpha/one-command-paper-demo-20261108
      - alpha/spectra-command-center-verified-20261109
    paths:
      - install-alpha.sh
      - scripts/**
      - scripts/update-alpha-api.sh
      - scripts/spectra-alpha-doctor.sh
      - scripts/spectra-alpha-start-api.sh
      - scripts/spectra
      - scripts/systemd/**
      - ALPHA-TEST.md
      - README.md
      - pyproject.toml
      - uv.lock
      - condor/fetchers/spectra_runtime.py
      - condor/web/routes/servers.py
      - spectra_core/**
      - mcp_servers/hummingbot_api/tools/**
      - condor/web/routes/**
      - frontend/**
      - routines/**
      - spectra_core/module_lifecycle.py
      - tests/test_module_lifecycle.py
      - tests/test_module_lifecycle_api.py
      - tests/test_module_registry.py
      - spectra_core/runtime.py
      - mcp_servers/hummingbot_api/settings.py
      - scripts/configure_alpha_paper_connector.py
      - scripts/configure_alpha_paper_state.py
      - tests/test_spectra_runtime_fail_closed.py
      - tests/test_spectra_runtime.py
      - tests/test_spectra_kraken_execution_flow.py
      - tests/test_alpha_backup.py
      - tests/test_asset_authority.py
      - tests/test_kraken_authorization.py
      - tests/test_vcap_entry.py
      - tests/test_market_discovery_route.py
      - tests/test_market_discovery.py
      - tests/spectra_test_support.py
      - tests/fixtures/**
      - tests/test_configure_alpha_paper_connector.py
      - tests/test_configure_alpha_paper_state.py
      - tests/test_hummingbot_mcp_config_dir.py
      - frontend/**
      - spectra_core/market_discovery.py
      - condor/web/routes/market.py
      - tests/test_market_discovery.py
      - tests/test_module_lifecycle.py
      - tests/test_module_lifecycle_api.py
      - tests/test_module_registry.py
      - spectra_core/market_discovery.py
      - spectra_core/capital_governor.py
      - routines/mean_reversion_scanner.py
      - routines/market_scanner.py
      - tests/test_market_discovery.py
      - tests/test_spectra_core.py
      - .github/workflows/alpha-installer.yml
  pull_request:
    paths:
      - install-alpha.sh
      - scripts/**
      - spectra_core/**
      - mcp_servers/hummingbot_api/tools/**
      - routines/**
      - tests/test_alpha_backup.py
      - tests/test_asset_authority.py
      - tests/test_kraken_authorization.py
      - tests/test_vcap_entry.py
      - tests/test_market_discovery_route.py
      - tests/spectra_test_support.py
      - tests/fixtures/**
      - tests/test_spectra_kraken_execution_flow.py
      - ALPHA-TEST.md
      - README.md
      - pyproject.toml
      - uv.lock
      - condor/fetchers/spectra_runtime.py
      - condor/web/routes/servers.py
      - spectra_core/runtime.py
      - spectra_core/module_lifecycle.py
      - tests/test_module_lifecycle.py
      - tests/test_module_lifecycle_api.py
      - tests/test_module_registry.py
      - spectra_core/market_discovery.py
      - spectra_core/capital_governor.py
      - routines/mean_reversion_scanner.py
      - routines/market_scanner.py
      - tests/test_market_discovery.py
      - tests/test_spectra_core.py
      - mcp_servers/hummingbot_api/settings.py
      - scripts/configure_alpha_paper_connector.py
      - scripts/configure_alpha_paper_state.py
      - tests/test_spectra_runtime_fail_closed.py
      - tests/test_configure_alpha_paper_connector.py
      - tests/test_configure_alpha_paper_state.py
      - tests/test_hummingbot_mcp_config_dir.py
      - frontend/**
      - .github/workflows/alpha-installer.yml

jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n install-alpha.sh
          bash -n scripts/update-alpha-api.sh
          for script in scripts/spectra-alpha-doctor.sh scripts/spectra-alpha-start-api.sh scripts/spectra-alpha-core-supervisor.sh scripts/spectra-alpha-backup.sh scripts/spectra; do
            bash -n "$script"
          done
          ! grep -q 'compose down' scripts/spectra
          grep -q 'Restart=on-failure' scripts/systemd/spectra-alpha-core.service
          grep -q 'OnUnitActiveSec=120s' scripts/systemd/spectra-alpha-doctor.timer
          grep -q 'OnCalendar=\*-\*-\* 03:30:00' scripts/systemd/spectra-alpha-backup.timer
          grep -q 'spectra-alpha-backup' scripts/spectra
          ! grep -Eq 'podman (volume|system) prune|docker (volume|system) prune|compose down -v' scripts/spectra-alpha-doctor.sh scripts/spectra-alpha-start-api.sh scripts/spectra
      - name: Enforce paper-only and no host socket mount
        run: |
          grep -q 'SPECTRA_PAPER_ONLY=true' install-alpha.sh
          grep -q 'SPECTRA_ALLOW_LIVE_EXECUTION=false' install-alpha.sh
          grep -q 'docker-compose.alpha.yml' install-alpha.sh
          grep -q 'docker.sock' install-alpha.sh
          ! grep -Eq 'docker compose .*docker-compose.yml up|podman-compose .*docker-compose.yml up' install-alpha.sh
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Core dependencies
        run: uv sync --locked --dev --python 3.12
      - name: Test alpha runtime safety and paper configuration
        run: uv run --python 3.12 pytest -q tests/test_spectra_runtime_fail_closed.py tests/test_spectra_runtime.py tests/test_spectra_kraken_execution_flow.py tests/test_configure_alpha_paper_connector.py tests/test_configure_alpha_paper_state.py tests/test_hummingbot_mcp_config_dir.py tests/test_market_discovery.py
      - name: Test persistent module lifecycle and registry
        run: uv run --python 3.12 pytest -q tests/test_module_lifecycle.py tests/test_module_registry.py
      - name: Test authenticated module trigger API
        run: uv run --python 3.12 pytest -q tests/test_module_lifecycle_api.py
      - name: Test strategy, accounting, restart, and recovery invariants
        run: |
          uv run --python 3.12 pytest -q \
            tests/test_alpha_backup.py \
            tests/test_asset_authority.py \
            tests/test_kraken_authorization.py \
            tests/test_vcap_entry.py \
            tests/test_market_discovery_route.py \
            tests/test_market_discovery.py \
            tests/test_spectra_executor_accounting_flow.py \
            tests/test_accounting_health_gate.py \
            tests/test_vcap_runtime_supervisor.py \
            tests/test_vcap_execution_loop.py \
            tests/test_vcap_restart_continuity.py \
            tests/test_strategy_laboratory.py \
            tests/test_strategy_replay.py \
            tests/test_strategy_replay_vcap.py \
            tests/test_module_lifecycle.py \
            tests/test_module_registry.py \
            tests/test_restart_on_boot_optin.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the Spectra dashboard
        working-directory: frontend
        run: npm ci && npm run build
      - name: Test visible market-feed failure and retry
        working-directory: frontend
        run: npm test -- src/components/market/OrderBook.test.tsx

  linux-install-smoke:
    name: Clean Linux one-command installation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the Podman-native Compose provider
        run: |
          python3 -m venv "$RUNNER_TEMP/podman-compose-venv"
          "$RUNNER_TEMP/podman-compose-venv/bin/pip" install --disable-pip-version-check podman-compose
          echo "$RUNNER_TEMP/podman-compose-venv/bin" >> "$GITHUB_PATH"
      - name: Run the public one-command installer
        run: bash install-alpha.sh
        env:
          SPECTRA_ALPHA_CORE_REF: feature/vcap-paper-entry-admission-20261110
      - name: Run the exact one-command in-place updater
        run: bash scripts/update-alpha-api.sh
        env:
          SPECTRA_ALPHA_CORE_REF: feature/vcap-paper-entry-admission-20261110
      - name: Verify dashboard and Kraken paper runtime
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:8088/overview >/dev/null
          API_USER="$(sed -n 's/^USERNAME=//p' "$HOME/SpectraFinance-Alpha/spectra-hummingbot-api/.env" | head -n 1)"
          API_PASS="$(sed -n 's/^PASSWORD=//p' "$HOME/SpectraFinance-Alpha/spectra-hummingbot-api/.env" | head -n 1)"
          curl -fsS -u "$API_USER:$API_PASS" http://127.0.0.1:8000/spectra/runtime > "$RUNNER_TEMP/spectra-runtime.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          runtime = json.loads(Path(os.environ["RUNNER_TEMP"] + "/spectra-runtime.json").read_text())
          assert runtime["mode"] == "PAPER_ONLY", runtime
          assert runtime["paper_only"] is True, runtime
          assert runtime["paper_connectors_only"] is True, runtime
          assert any(name.endswith("/kraken_paper_trade") for name in runtime["paper_connectors"]), runtime
          assert runtime["live_dispatch_available"] is False, runtime
          print("Clean Linux install verified: Spectra dashboard and Kraken paper connector are running.")
          PY
          "$HOME/.local/bin/spectra" status
      - name: Export isolated paper API test environment
        shell: bash
        run: |
          python - "$HOME/SpectraFinance-Alpha/spectra-hummingbot-api/.env" "$HOME/SpectraFinance-Alpha/spectra-core/.env" "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import sys

          def read_env(path):
              values = {}
              for raw in Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                      value = value[1:-1]
                  values[key.strip()] = value
              return values

          api = read_env(sys.argv[1])
          core = read_env(sys.argv[2])
          required = {
              "HUMMINGBOT_API_URL": "http://127.0.0.1:8000",
              "HUMMINGBOT_USERNAME": api.get("USERNAME", ""),
              "HUMMINGBOT_PASSWORD": api.get("PASSWORD", ""),
              "SPECTRA_DISPATCH_PRIVATE_KEY": core.get("SPECTRA_DISPATCH_PRIVATE_KEY", ""),
              "SPECTRA_PAPER_ONLY": core.get("SPECTRA_PAPER_ONLY", ""),
              "SPECTRA_ALLOW_LIVE_EXECUTION": core.get("SPECTRA_ALLOW_LIVE_EXECUTION", ""),
              "CONDOR_AGENT_SLUG": core.get("CONDOR_AGENT_SLUG", ""),
          }
          missing = [key for key, value in required.items() if not value]
          if missing:
              raise SystemExit("Paper integration test environment is incomplete: " + ", ".join(missing))
          if required["SPECTRA_PAPER_ONLY"].lower() != "true" or required["SPECTRA_ALLOW_LIVE_EXECUTION"].lower() != "false":
              raise SystemExit("Paper integration test refused: unsafe execution flags.")
          for name in ("HUMMINGBOT_USERNAME", "HUMMINGBOT_PASSWORD", "SPECTRA_DISPATCH_PRIVATE_KEY"):
              print(f"::add-mask::{required[name]}")
          with open(sys.argv[3], "a", encoding="utf-8") as env:
              for key, value in required.items():
                  env.write(f"{key}={value}\n")
          PY
      - name: Verify governed Kraken paper order, fill, accounting, and restart recovery
        env:
          SPECTRA_CI_PAPER_EXECUTION: "1"
        run: |
          cd "$HOME/SpectraFinance-Alpha/spectra-core"
          # The installer checks out a separately pinned Alpha ref. Overlay only
          # the PR diagnostic test so CI reports the exact Governor rejection
          # reason without changing installed production code.
          cp "$GITHUB_WORKSPACE/tests/test_spectra_kraken_execution_flow.py" tests/test_spectra_kraken_execution_flow.py
          .venv/bin/python -m pytest -q tests/test_spectra_kraken_execution_flow.py -k live_api_paper_execution
      - name: Stop alpha services
        if: always()
        run: '$HOME/.local/bin/spectra stop || true'
