name: Spectra Alpha Frontend Verification

on:
  pull_request:
    branches:
      - alpha/one-command-paper-demo-20261108
    paths:
      - "frontend/**"
      - ".github/workflows/spectra-alpha-frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check new lint errors
        run: npm run lint:ci

      - name: Type-check and build production frontend
        run: npm run build
